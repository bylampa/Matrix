name: Build and publish addon

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ts_version:
        description: 'TorrServer version tag (e.g. MatriX.146.UN)'
        required: false
        default: 'MatriX.146.UN'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine TS_VERSION
        id: ts
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.ts_version || 'MatriX.146.UN' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./torrserver
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/bylampa/torrserver-matrix:${{ matrix.arch }}
            ghcr.io/bylampa/torrserver-matrix:${{ matrix.arch }}-latest
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            TS_VERSION=${{ steps.ts.outputs.version }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/bylampa/torrserver-matrix:latest \
            ghcr.io/bylampa/torrserver-matrix:amd64-latest \
            ghcr.io/bylampa/torrserver-matrix:aarch64-latest
