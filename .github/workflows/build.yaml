name: Build and publish addon

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, aarch64, armv7]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./torrserver
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || matrix.arch == 'armv7' && 'linux/arm/v7' || 'linux/amd64' }}
          push: true
          tags: |
            ghcr.io/bylampa/torrserver-matrix:${{ matrix.arch }}-${{ github.event.release.tag_name }}
            ghcr.io/bylampa/torrserver-matrix:${{ matrix.arch }}-latest
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
