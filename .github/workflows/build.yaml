name: Build and publish addon

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./torrserver
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/bylampa/torrserver-matrix:${{ matrix.arch }}-${{ github.event.release.tag_name }}
            ghcr.io/bylampa/torrserver-matrix:${{ matrix.arch }}-latest
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
