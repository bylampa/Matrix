name: Build and publish addon

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ts_version:
        description: 'TorrServer version tag (e.g. MatriX.146.UN)'
        required: false
        default: 'MatriX.146.UN'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      addon_ver: ${{ steps.ver.outputs.addon_ver }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract versions
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.ts_version || 'MatriX.146.UN' }}"
          fi
          # MatriX.146.UN -> 146.0.0
          NUM=$(echo "$TAG" | grep -oE '[0-9]+' | head -1)
          echo "ts_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "addon_ver=${NUM}.0.0" >> "$GITHUB_OUTPUT"
          echo "Determined: ts_tag=${TAG}, addon_ver=${NUM}.0.0"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./torrserver
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/bylampa/torrserver-matrix/${{ matrix.arch }}:${{ steps.ver.outputs.addon_ver }}
            ghcr.io/bylampa/torrserver-matrix/${{ matrix.arch }}:latest
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            TS_VERSION=${{ steps.ver.outputs.ts_tag }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest (latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/bylampa/torrserver-matrix/latest \
            ghcr.io/bylampa/torrserver-matrix/amd64:latest \
            ghcr.io/bylampa/torrserver-matrix/aarch64:latest

      - name: Create multi-arch manifest (versioned)
        if: needs.build.outputs.addon_ver != ''
        run: |
          VERSION="${{ needs.build.outputs.addon_ver }}"
          docker buildx imagetools create \
            -t ghcr.io/bylampa/torrserver-matrix/${VERSION} \
            ghcr.io/bylampa/torrserver-matrix/amd64:${VERSION} \
            ghcr.io/bylampa/torrserver-matrix/aarch64:${VERSION}
